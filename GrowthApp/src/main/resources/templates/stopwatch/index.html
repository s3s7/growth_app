<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストップウォッチ - GrowthApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <link rel="stylesheet" th:href="@{/css/stopwatch.css}">
</head>
<body>

<header>
    <div class="logo"><a href="/" style="color:white;text-decoration:none;">GrowthApp</a></div>
    <nav>
        <a href="/">ホーム</a>
        <a href="/growth_records">記録一覧</a>
        <a href="/growth_records/new">記録を作成</a>
        <a href="/stopwatch" class="active">ストップウォッチ</a>
    </nav>
</header>

<main class="sw-main">

    <section class="sw-section">
        <h2 class="sw-heading">ストップウォッチ</h2>

        <div class="sw-display" id="swDisplay">00:00:00.0</div>

        <div class="sw-controls">
            <button id="btnStartPause" class="sw-btn sw-btn-start" onclick="toggleStartPause()">スタート</button>
            <button id="btnLap" class="sw-btn sw-btn-lap" onclick="recordLap()" disabled>ラップ</button>
            <button id="btnReset" class="sw-btn sw-btn-reset" onclick="resetTimer()" disabled>リセット</button>
        </div>

        <div class="sw-laps" id="swLaps" style="display:none;">
            <h3 class="sw-laps-heading">ラップ記録</h3>
            <ol id="lapList" class="lap-list"></ol>
        </div>
    </section>

    <section class="sw-save-section">
        <h2 class="sw-heading">成長記録として保存</h2>

        <form th:action="@{/growth_records}" th:object="${growthRecord}" method="post">

            <div class="form-group">
                <label for="title">タイトル <span class="required">*</span></label>
                <input type="text" id="title" th:field="*{title}" placeholder="例：英語学習 1時間セッション">
                <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="form-group">
                <label for="date">日付 <span class="required">*</span></label>
                <input type="date" id="date" th:field="*{date}">
                <span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
            </div>

            <div class="form-group">
                <label for="category">カテゴリ</label>
                <select id="category" th:field="*{category}">
                    <option value="">選択してください</option>
                    <option value="学習">学習</option>
                    <option value="運動">運動</option>
                    <option value="仕事">仕事</option>
                    <option value="趣味">趣味</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">内容 <span class="required">*</span></label>
                <textarea id="content" th:field="*{content}" rows="5" placeholder="今日の取り組みや学びを記録しましょう..."></textarea>
                <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
            </div>

            <div class="form-group">
                <label>計測時間</label>
                <div class="sw-duration-display" id="durationDisplay">未計測</div>
                <input type="hidden" id="durationSeconds" th:field="*{durationSeconds}">
            </div>

            <div class="form-actions">
                <a href="/growth_records" class="btn-secondary">キャンセル</a>
                <button type="submit" class="btn">保存する</button>
            </div>

        </form>
    </section>
</main>

<script>
    let startTime = 0;
    let elapsedTime = 0;
    let timerId = null;
    let isRunning = false;
    let lapTimes = [];
    let lastLapTime = 0;

    function formatTime(ms) {
        const totalTenths = Math.floor(ms / 100);
        const tenths = totalTenths % 10;
        const totalSeconds = Math.floor(ms / 1000);
        const seconds = totalSeconds % 60;
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const hours = Math.floor(totalSeconds / 3600);
        return `${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)}.${tenths}`;
    }

    function pad2(n) {
        return String(n).padStart(2, '0');
    }

    function tick() {
        elapsedTime = Date.now() - startTime;
        document.getElementById('swDisplay').textContent = formatTime(elapsedTime);
    }

    function toggleStartPause() {
        if (isRunning) {
            clearInterval(timerId);
            elapsedTime = Date.now() - startTime;
            isRunning = false;
            document.getElementById('btnStartPause').textContent = '再開';
            document.getElementById('btnStartPause').className = 'sw-btn sw-btn-resume';
        } else {
            startTime = Date.now() - elapsedTime;
            timerId = setInterval(tick, 100);
            isRunning = true;
            document.getElementById('btnStartPause').textContent = 'ポーズ';
            document.getElementById('btnStartPause').className = 'sw-btn sw-btn-pause';
            document.getElementById('btnLap').disabled = false;
            document.getElementById('btnReset').disabled = false;
        }
    }

    function recordLap() {
        if (!isRunning) return;
        const currentTime = elapsedTime + (Date.now() - startTime);
        const lapDuration = currentTime - lastLapTime;
        lastLapTime = currentTime;
        lapTimes.push(lapDuration);

        const lapList = document.getElementById('lapList');
        const li = document.createElement('li');
        li.className = 'lap-item';
        li.innerHTML = `<span class="lap-num">#${lapTimes.length}</span><span class="lap-time">${formatTime(lapDuration)}</span><span class="lap-total">${formatTime(currentTime)}</span>`;
        lapList.prepend(li);

        document.getElementById('swLaps').style.display = 'block';
    }

    function resetTimer() {
        clearInterval(timerId);
        isRunning = false;
        elapsedTime = 0;
        lastLapTime = 0;
        lapTimes = [];
        document.getElementById('swDisplay').textContent = '00:00:00.0';
        document.getElementById('btnStartPause').textContent = 'スタート';
        document.getElementById('btnStartPause').className = 'sw-btn sw-btn-start';
        document.getElementById('btnLap').disabled = true;
        document.getElementById('btnReset').disabled = true;
        document.getElementById('lapList').innerHTML = '';
        document.getElementById('swLaps').style.display = 'none';
        updateDurationDisplay(0);
    }

    function updateDurationDisplay(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const hours = Math.floor(mins / 60);
        const displayMins = mins % 60;

        let text = '';
        if (hours > 0) text += `${hours}時間`;
        if (displayMins > 0 || hours > 0) text += `${displayMins}分`;
        text += `${secs}秒`;

        document.getElementById('durationDisplay').textContent = ms > 0 ? text : '未計測';
        document.getElementById('durationSeconds').value = ms > 0 ? totalSeconds : '';
    }

    document.querySelector('form').addEventListener('submit', function() {
        const currentElapsed = isRunning ? (Date.now() - startTime) : elapsedTime;
        updateDurationDisplay(currentElapsed);
    });

    setInterval(function() {
        if (isRunning) {
            const current = Date.now() - startTime;
            updateDurationDisplay(current);
        }
    }, 1000);

    // 今日の日付をデフォルトセット
    const dateInput = document.getElementById('date');
    if (!dateInput.value) {
        dateInput.value = new Date().toISOString().split('T')[0];
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成長記録を編集 - GrowthApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>

<header>
    <div class="logo"><a href="/" style="color:white;text-decoration:none;">GrowthApp</a></div>
    <nav>
        <a href="/">ホーム</a>
        <a href="/growth_records">記録一覧</a>
        <a href="/growth_records/new">記録を作成</a>
        <a href="/stopwatch">ストップウォッチ</a>
        <a href="/mypage">マイページ</a>
    </nav>
</header>

<main class="form-container">
    <h2 class="form-title">成長記録を編集</h2>

    <form th:action="@{/growth_records/{id}(id=${recordId})}" th:object="${growthRecordForm}" method="post">
        <input type="hidden" name="_method" value="post">

        <div class="form-group">
            <label for="title">タイトル <span class="required">*</span></label>
            <input type="text" id="title" th:field="*{title}" placeholder="例：英語学習 Week1">
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="form-group">
            <label for="date">日付 <span class="required">*</span></label>
            <input type="date" id="date" th:field="*{date}">
            <span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
        </div>

        <div class="form-group">
            <label for="category">カテゴリ</label>
            <select id="category" th:field="*{category}">
                <option value="">選択してください</option>
                <option value="学習">学習</option>
                <option value="運動">運動</option>
                <option value="仕事">仕事</option>
                <option value="趣味">趣味</option>
                <option value="その他">その他</option>
            </select>
        </div>

        <div class="form-group">
            <label for="content">内容 <span class="required">*</span></label>
            <textarea id="content" th:field="*{content}" rows="6" placeholder="今日の取り組みや学びを記録しましょう..."></textarea>
            <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
        </div>

        <div class="form-actions">
            <a href="/growth_records" class="btn-secondary">キャンセル</a>
            <button type="submit" class="btn">更新する</button>
        </div>

    </form>
</main>

</body>
</html>
